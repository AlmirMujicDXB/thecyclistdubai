<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>TheCyclistDubai · 168 Hours</title>
    <style>
        /* ── Fullscreen Reset ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            touch-action: manipulation;
            background: #d4d4d4;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', 'Helvetica Neue', system-ui, -apple-system, sans-serif;
            padding: 12px;
            min-height: 100dvh;
            height: 100dvh;
            background: radial-gradient(ellipse at 50% 30%, #e8e8e8, #b8b8b8);
            position: relative;
        }

        /* ── Cycling Computer Frame ── */
        .device-frame {
            background: linear-gradient(145deg, #d0d0d0, #b0b0b0);
            padding: 18px 12px;
            border-radius: 48px;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.15),
                0 0 0 2px #c8c8c8 inset,
                0 -4px 12px rgba(0, 0, 0, 0.05) inset;
            max-width: 440px;
            width: 100%;
            height: 100%;
            max-height: 820px;
            display: flex;
            flex-direction: column;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* subtle frame details */
        .device-frame::before {
            content: '';
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 6px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 10px;
        }

        /* ── Screen – monochrome e-ink / LCD style ── */
        .screen {
            background: #f5f5ee;
            border-radius: 32px;
            padding: 18px 14px 14px;
            flex: 1;
            display: flex;
            flex-direction: column;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.04);
            border: 1px solid #d8d8d0;
            position: relative;
            overflow: hidden;
        }

        /* ── Device Header: TheCyclistDubai ── */
        .device-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            padding-bottom: 10px;
            border-bottom: 1px solid #e0e0d8;
            margin-bottom: 8px;
        }

        .device-name {
            font-size: clamp(12px, 2.2vmin, 18px);
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #3a3a3a;
            text-transform: uppercase;
        }
        .device-name small {
            font-weight: 400;
            color: #8a8a8a;
            font-size: 0.7em;
            letter-spacing: 0.5px;
        }

        .device-status {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #6a6a6a;
            font-size: clamp(10px, 1.6vmin, 14px);
        }
        .device-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3a3a3a;
        }

        /* ── Main Metric – 168 Hours ── */
        .main-metric {
            text-align: center;
            flex-shrink: 0;
            padding: 4px 0 10px;
        }

        .metric-label {
            font-size: clamp(8px, 1.2vmin, 11px);
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #8a8a8a;
        }

        .metric-value {
            font-family: 'SF Mono', 'Courier New', monospace;
            font-size: clamp(38px, 8vmin, 64px);
            font-weight: 800;
            color: #1c1c1e;
            line-height: 1;
            letter-spacing: -1px;
            display: inline-block;
        }
        .metric-unit {
            font-size: clamp(12px, 2.2vmin, 18px);
            font-weight: 600;
            color: #6a6a6a;
            margin-left: 4px;
            letter-spacing: 1px;
        }

        .metric-sub {
            font-size: clamp(9px, 1.4vmin, 13px);
            color: #8a8a8a;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        /* ── Levers – like cycling computer data fields ── */
        .levers {
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: clamp(4px, 1vmin, 12px);
            padding: 4px 0 2px;
            flex: 1 1 auto;
            min-height: 0;
            flex-wrap: nowrap;
        }

        .lever {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            flex: 1 1 0;
            min-width: 0;
            max-width: 160px;
            background: rgba(0, 0, 0, 0.01);
            border-radius: clamp(12px, 2vmin, 20px);
            padding: clamp(4px, 0.8vmin, 10px) clamp(2px, 0.3vmin, 6px) clamp(3px, 0.5vmin, 6px);
            border: 1px solid #e8e8e0;
            transition: background 0.2s, border-color 0.2s;
        }

        .lever:hover {
            background: rgba(0, 0, 0, 0.02);
            border-color: #d0d0c8;
        }

        .lever-header {
            display: flex;
            align-items: center;
            gap: clamp(2px, 0.4vmin, 5px);
            margin-bottom: clamp(1px, 0.2vmin, 4px);
            flex-shrink: 0;
        }

        .lever-header .icon {
            font-size: clamp(12px, 2.2vmin, 18px);
            filter: grayscale(1);
            opacity: 0.7;
        }

        .lever-header .name {
            font-size: clamp(6px, 1.1vmin, 10px);
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            color: #6a6a6a;
            white-space: nowrap;
        }

        /* ── Track – like a battery / power gauge ── */
        .track-wrap {
            position: relative;
            width: clamp(18px, 3.8vmin, 34px);
            flex: 1 1 auto;
            min-height: 30px;
            max-height: 200px;
            background: #e8e8e0;
            border-radius: 40px;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.03);
            border: 1px solid #d8d8d0;
            cursor: pointer;
            touch-action: none;
            margin: 1px 0;
        }

        .track-wrap::after {
            content: '';
            position: absolute;
            inset: 1px;
            border-radius: 38px;
            background: rgba(255, 255, 255, 0.2);
            pointer-events: none;
        }

        .fill {
            position: absolute;
            bottom: 2px;
            left: 2px;
            right: 2px;
            border-radius: 0 0 36px 36px;
            transition: height 0.08s ease-out, background 0.3s;
            pointer-events: none;
            will-change: height;
            min-height: 2px;
            background: #3a3a3c;
        }

        .fill::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 0 0 36px 36px;
            background: inherit;
            filter: blur(6px);
            opacity: 0.2;
            z-index: -1;
            transition: opacity 0.3s;
        }

        .lever:hover .fill::after {
            opacity: 0.4;
        }

        @keyframes pulseGlow {
            0% { filter: brightness(1) drop-shadow(0 0 0 transparent); }
            50% { filter: brightness(1.1) drop-shadow(0 0 12px rgba(0, 0, 0, 0.08)); }
            100% { filter: brightness(1) drop-shadow(0 0 0 transparent); }
        }

        .lever-pulse .fill {
            animation: pulseGlow 0.5s ease 2;
        }

        .handle {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: clamp(24px, 4.6vmin, 34px);
            height: clamp(24px, 4.6vmin, 34px);
            min-width: 40px;
            min-height: 40px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, #ffffff, #e8e8e8);
            box-shadow: 
                0 0 0 1px rgba(0, 0, 0, 0.04),
                0 2px 12px rgba(0, 0, 0, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            cursor: grab;
            touch-action: none;
            z-index: 10;
            transition: box-shadow 0.2s, transform 0.15s;
            will-change: transform;
            border: 1px solid #c8c8c0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .handle:active {
            cursor: grabbing;
            transform: translateX(-50%) scale(0.92);
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .handle::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: clamp(6px, 1.2vmin, 10px);
            height: clamp(6px, 1.2vmin, 10px);
            border-radius: 50%;
            background: #3a3a3c;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.02);
            transition: transform 0.2s;
        }

        .face-dynamic {
            position: absolute;
            right: clamp(-20px, -3.6vmin, -36px);
            top: 50%;
            transform: translateY(-50%);
            font-size: clamp(16px, 3.2vmin, 26px);
            line-height: 1;
            filter: grayscale(1);
            opacity: 0.8;
            transition: transform 0.2s, filter 0.3s;
            pointer-events: none;
        }

        .value-display {
            margin-top: clamp(2px, 0.4vmin, 6px);
            font-family: 'SF Mono', 'Courier New', monospace;
            font-size: clamp(10px, 2vmin, 16px);
            font-weight: 700;
            color: #1c1c1e;
            letter-spacing: 0.2px;
            background: #ecece6;
            padding: 0.04rem 0.5rem;
            border-radius: 30px;
            border: 1px solid #d8d8d0;
            font-variant-numeric: tabular-nums;
            min-width: 1.6rem;
            text-align: center;
            transition: background 0.3s;
            flex-shrink: 0;
        }

        .value-display .unit {
            font-family: 'Inter', sans-serif;
            font-size: clamp(6px, 1vmin, 9px);
            font-weight: 400;
            color: #8a8a8a;
            margin-left: 1px;
        }

        .lever-label {
            font-size: clamp(5px, 0.9vmin, 8px);
            letter-spacing: 0.2px;
            text-transform: uppercase;
            color: #8a8a8a;
            margin-top: clamp(1px, 0.2vmin, 3px);
            font-weight: 500;
            text-align: center;
            line-height: 1.2;
            flex-shrink: 0;
        }

        .max-label {
            display: block;
            font-size: clamp(4px, 0.7vmin, 6px);
            font-weight: 400;
            color: #b0b0a8;
            margin-top: 0px;
        }

        /* ── Footer / Buttons ── */
        .device-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            padding-top: clamp(6px, 1vmin, 12px);
            margin-top: auto;
            border-top: 1px solid #e0e0d8;
            gap: 8px;
        }

        .key-hint {
            font-size: clamp(7px, 1.2vmin, 10px);
            color: #8a8a8a;
            letter-spacing: 0.3px;
            background: rgba(0, 0, 0, 0.02);
            padding: 0.04rem 0.6rem;
            border-radius: 20px;
            border: 1px solid #e0e0d8;
            white-space: nowrap;
            text-transform: uppercase;
            font-weight: 500;
        }
        .key-hint kbd {
            display: inline-block;
            background: #ecece6;
            padding: 0 5px;
            border-radius: 3px;
            font-family: inherit;
            color: #3a3a3a;
            font-size: clamp(6px, 1vmin, 9px);
            border: 1px solid #d0d0c8;
        }

        .share-btn {
            display: inline-flex;
            align-items: center;
            gap: clamp(4px, 0.6vmin, 8px);
            background: #3a3a3c;
            color: #ffffff;
            border: none;
            padding: 0.08rem 1rem;
            border-radius: 60px;
            font-size: clamp(8px, 1.4vmin, 12px);
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
            white-space: nowrap;
            touch-action: manipulation;
            min-height: 36px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .share-btn:active {
            transform: scale(0.94);
            background: #2a2a2c;
        }
        .share-btn .icon {
            font-size: clamp(12px, 2vmin, 18px);
        }

        /* ── Scrollbar hide ── */
        ::-webkit-scrollbar { width: 0; }

        /* ── Extra small screens ── */
        @media (max-width: 420px) {
            .device-frame { padding: 12px 8px; border-radius: 36px; }
            .screen { padding: 12px 8px 10px; border-radius: 24px; }
            .levers { gap: 2px; }
            .lever { padding: 3px 1px 3px; border-radius: 10px; }
            .face-dynamic { right: auto; top: -14px; transform: none; font-size: 14px; }
            .lever:hover .face-dynamic { transform: scale(1.05); }
            .track-wrap { width: 16px; min-height: 24px; }
            .handle { min-width: 32px; min-height: 32px; width: 22px; height: 22px; }
            .handle::after { width: 5px; height: 5px; }
            .value-display { font-size: 8px; min-width: 1rem; padding: 0 3px; }
            .lever-header .name { font-size: 5px; }
            .lever-header .icon { font-size: 10px; }
            .max-label { font-size: 3px; }
            .share-btn { font-size: 7px; padding: 0.03rem 0.6rem; min-height: 28px; }
            .share-btn .icon { font-size: 10px; }
            .key-hint { font-size: 6px; padding: 0.02rem 0.4rem; }
            .device-name { font-size: 10px; }
            .metric-value { font-size: 28px; }
            .metric-unit { font-size: 12px; }
            .header { margin-bottom: 2px; }
        }

        @media (max-height: 640px) {
            .device-frame { padding: 10px 8px; border-radius: 32px; max-height: 100dvh; }
            .screen { padding: 10px 8px 8px; border-radius: 20px; }
            .track-wrap { min-height: 24px; }
            .handle { min-width: 28px; min-height: 28px; width: 20px; height: 20px; }
            .face-dynamic { font-size: 14px; right: -16px; }
            .value-display { font-size: 9px; min-width: 1rem; }
            .lever { padding: 2px 1px 2px; }
            .lever-label { font-size: 5px; }
            .max-label { font-size: 3px; }
            .share-btn { font-size: 7px; padding: 0.03rem 0.6rem; min-height: 26px; }
            .key-hint { font-size: 6px; }
            .metric-value { font-size: 32px; }
            .device-name { font-size: 11px; }
        }

        @media (max-height: 560px) {
            .metric-value { font-size: 24px; }
            .metric-label { font-size: 7px; }
            .device-header { padding-bottom: 4px; margin-bottom: 4px; }
            .main-metric { padding: 2px 0 6px; }
            .levers { padding: 2px 0; }
            .track-wrap { min-height: 18px; }
            .handle { min-width: 24px; min-height: 24px; width: 16px; height: 16px; }
            .handle::after { width: 4px; height: 4px; }
            .face-dynamic { font-size: 10px; right: -12px; }
            .value-display { font-size: 7px; min-width: 0.8rem; padding: 0 2px; }
            .lever-header .name { font-size: 4px; }
            .lever-header .icon { font-size: 8px; }
            .share-btn { font-size: 6px; padding: 0.02rem 0.4rem; min-height: 20px; }
            .share-btn .icon { font-size: 8px; }
            .key-hint { font-size: 5px; padding: 0.01rem 0.3rem; }
            .lever-label { font-size: 4px; }
            .max-label { font-size: 2px; }
            .levers { gap: 1px; }
            .lever { padding: 1px 1px 1px; border-radius: 8px; }
            .device-frame { padding: 6px 4px; border-radius: 24px; }
            .screen { padding: 6px 4px 4px; border-radius: 16px; }
        }
    </style>
</head>
<body>

    <div class="device-frame">
        <div class="screen">

            <!-- Device Header: TheCyclistDubai -->
            <div class="device-header">
                <span class="device-name">TheCyclist<small>Dubai</small></span>
                <span class="device-status">
                    <span class="dot"></span>
                    <span>LIVE</span>
                </span>
            </div>

            <!-- Main Metric -->
            <div class="main-metric">
                <div class="metric-label">Weekly Power</div>
                <div>
                    <span class="metric-value" id="totalDisplay">168</span>
                    <span class="metric-unit">H</span>
                </div>
                <div class="metric-sub">⌛ 7 days · drag to allocate</div>
            </div>

            <!-- Levers -->
            <div class="levers" id="leversContainer">

                <!-- 0: Ride -->
                <div class="lever lever-0" data-index="0">
                    <div class="lever-header">
                        <span class="icon">🚴</span>
                        <span class="name">Ride</span>
                    </div>
                    <div class="track-wrap" id="track0">
                        <div class="fill" id="fill0" style="height:40%;"></div>
                        <div class="handle" id="handle0" style="bottom:40%;"></div>
                        <div class="face-dynamic" id="face0">😐</div>
                        <div class="tooltip">drag</div>
                    </div>
                    <div class="value-display" id="value0">42 <span class="unit">h</span></div>
                    <div class="lever-label">max 40h · happy 10h</div>
                </div>

                <!-- 1: Family -->
                <div class="lever lever-1" data-index="1">
                    <div class="lever-header">
                        <span class="icon">👨‍👩‍👧‍👦</span>
                        <span class="name">Family</span>
                    </div>
                    <div class="track-wrap" id="track1">
                        <div class="fill" id="fill1" style="height:40%;"></div>
                        <div class="handle" id="handle1" style="bottom:40%;"></div>
                        <div class="face-dynamic" id="face1">😐</div>
                        <div class="tooltip">drag</div>
                    </div>
                    <div class="value-display" id="value1">42 <span class="unit">h</span></div>
                    <div class="lever-label">rest of 168h · happy 50h</div>
                </div>

                <!-- 2: Work -->
                <div class="lever lever-2" data-index="2">
                    <div class="lever-header">
                        <span class="icon">💼</span>
                        <span class="name">Work</span>
                    </div>
                    <div class="track-wrap" id="track2">
                        <div class="fill" id="fill2" style="height:40%;"></div>
                        <div class="handle" id="handle2" style="bottom:40%;"></div>
                        <div class="face-dynamic" id="face2">😐</div>
                        <div class="tooltip">drag</div>
                    </div>
                    <div class="value-display" id="value2">42 <span class="unit">h</span></div>
                    <div class="lever-label">max 84h · happy 48h</div>
                </div>

                <!-- 3: Recovery -->
                <div class="lever lever-3" data-index="3">
                    <div class="lever-header">
                        <span class="icon">😴</span>
                        <span class="name">Recovery</span>
                    </div>
                    <div class="track-wrap" id="track3">
                        <div class="fill" id="fill3" style="height:40%;"></div>
                        <div class="handle" id="handle3" style="bottom:40%;"></div>
                        <div class="face-dynamic" id="face3">😐</div>
                        <div class="tooltip">drag</div>
                    </div>
                    <div class="value-display" id="value3">42 <span class="unit">h</span></div>
                    <div class="lever-label">max 84h · happy 56h</div>
                </div>
            </div>

            <!-- Footer -->
            <div class="device-footer">
                <span class="key-hint">press <kbd>R</kbd> reset</span>
                <button class="share-btn" id="shareBtn">
                    <span class="icon">📤</span> Share
                </button>
            </div>

        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const MAX_HOURS = 168;
            const NUM_LEVERS = 4;

            // ── Lever Configuration ──
            const LEVER_CONFIG = [
                { maxHours: 40, happyThreshold: 10, label: 'Ride' },
                { maxHours: 168, happyThreshold: 50, label: 'Family' },
                { maxHours: 84, happyThreshold: 48, label: 'Work' },
                { maxHours: 84, happyThreshold: 56, label: 'Recovery' },
            ];

            const values = [42, 42, 42, 42];
            let draggingIndex = -1;
            let dragStartY = 0;
            let dragStartValue = 0;

            const tracks = [];
            const handles = [];
            const fills = [];
            const faceEls = [];
            const valueEls = [];
            const leverEls = [];

            for (let i = 0; i < NUM_LEVERS; i++) {
                tracks.push(document.getElementById('track' + i));
                handles.push(document.getElementById('handle' + i));
                fills.push(document.getElementById('fill' + i));
                faceEls.push(document.getElementById('face' + i));
                valueEls.push(document.getElementById('value' + i));
                leverEls.push(document.querySelector(`.lever-${i}`));
            }
            const totalDisplay = document.getElementById('totalDisplay');
            const shareBtn = document.getElementById('shareBtn');

            function getTrackHeight(index) {
                return tracks[index].getBoundingClientRect().height;
            }

            function valueToPercent(v, maxHours) {
                return (v / maxHours) * 100;
            }

            function getMood(value, index) {
                const threshold = LEVER_CONFIG[index].happyThreshold;
                if (value >= threshold) return '🤩';
                if (value === 0) return '🤬';
                const ratio = value / threshold;
                if (ratio < 0.2) return '😡';
                if (ratio < 0.4) return '😠';
                if (ratio < 0.6) return '😕';
                if (ratio < 0.8) return '😐';
                return '🙂';
            }

            function updateUI(index) {
                const v = values[index];
                const maxH = LEVER_CONFIG[index].maxHours;
                const p = Math.max(0, Math.min(100, valueToPercent(v, maxH)));

                fills[index].style.height = p + '%';
                handles[index].style.bottom = p + '%';

                const rounded = Math.round(v);
                valueEls[index].innerHTML = rounded + ' <span class="unit">h</span>';

                const mood = getMood(v, index);
                faceEls[index].textContent = mood;
                faceEls[index].title = mood + ' (' + rounded + 'h)';

                const total = values.reduce((a, b) => a + b, 0);
                totalDisplay.textContent = Math.round(total);
            }

            function updateAllUI() {
                for (let i = 0; i < NUM_LEVERS; i++) updateUI(i);
            }

            function pulseLevers(excludeIndex) {
                for (let i = 0; i < NUM_LEVERS; i++) {
                    if (i === excludeIndex) continue;
                    leverEls[i].classList.remove('lever-pulse');
                    void leverEls[i].offsetWidth;
                    leverEls[i].classList.add('lever-pulse');
                }
            }

            function redistribute(changedIndex, newValue) {
                const config = LEVER_CONFIG[changedIndex];
                newValue = Math.max(0, Math.min(config.maxHours, newValue));
                newValue = Math.round(newValue);

                let others = [];
                for (let i = 0; i < NUM_LEVERS; i++) {
                    if (i !== changedIndex) others.push(i);
                }

                let remaining = MAX_HOURS - newValue;
                remaining = Math.max(0, remaining);

                let sumOthers = 0;
                for (const idx of others) {
                    sumOthers += values[idx];
                }

                if (sumOthers === 0) {
                    let each = remaining / others.length;
                    for (const idx of others) {
                        values[idx] = Math.round(each);
                    }
                } else {
                    for (const idx of others) {
                        let proportion = values[idx] / sumOthers;
                        values[idx] = Math.round(remaining * proportion);
                    }
                }

                let totalOthers = 0;
                for (const idx of others) {
                    values[idx] = Math.max(0, Math.min(LEVER_CONFIG[idx].maxHours, values[idx]));
                    totalOthers += values[idx];
                }

                let diff = remaining - totalOthers;
                if (diff > 0) {
                    let available = [];
                    for (const idx of others) {
                        if (values[idx] < LEVER_CONFIG[idx].maxHours) {
                            available.push(idx);
                        }
                    }
                    if (available.length > 0) {
                        let sumAvailable = 0;
                        for (const idx of available) {
                            sumAvailable += (LEVER_CONFIG[idx].maxHours - values[idx]);
                        }
                        if (sumAvailable > 0) {
                            for (const idx of available) {
                                let add = Math.round(diff * (LEVER_CONFIG[idx].maxHours - values[idx]) / sumAvailable);
                                values[idx] += add;
                                values[idx] = Math.min(LEVER_CONFIG[idx].maxHours, values[idx]);
                            }
                            let newTotalOthers = 0;
                            for (const idx of others) newTotalOthers += values[idx];
                            diff = remaining - newTotalOthers;
                            if (diff > 0) {
                                for (const idx of available) {
                                    if (values[idx] < LEVER_CONFIG[idx].maxHours) {
                                        values[idx] += diff;
                                        values[idx] = Math.min(LEVER_CONFIG[idx].maxHours, values[idx]);
                                        break;
                                    }
                                }
                            }
                        }
                    }
                } else if (diff < 0) {
                    let sumOthersForReduction = 0;
                    for (const idx of others) sumOthersForReduction += values[idx];
                    if (sumOthersForReduction > 0) {
                        for (const idx of others) {
                            let reduction = Math.round(-diff * values[idx] / sumOthersForReduction);
                            values[idx] -= reduction;
                            values[idx] = Math.max(0, values[idx]);
                        }
                        let newTotalOthers = 0;
                        for (const idx of others) newTotalOthers += values[idx];
                        let finalDiff = remaining - newTotalOthers;
                        if (finalDiff > 0) {
                            for (const idx of others) {
                                if (values[idx] < LEVER_CONFIG[idx].maxHours) {
                                    values[idx] += finalDiff;
                                    break;
                                }
                            }
                        }
                    }
                }

                values[changedIndex] = Math.round(newValue);

                for (let i = 0; i < NUM_LEVERS; i++) {
                    values[i] = Math.max(0, Math.min(LEVER_CONFIG[i].maxHours, Math.round(values[i])));
                }

                let total = values.reduce((a, b) => a + b, 0);
                if (total !== MAX_HOURS) {
                    let diffTotal = MAX_HOURS - total;
                    let added = false;
                    for (let i = 0; i < NUM_LEVERS; i++) {
                        if (i !== changedIndex && values[i] < LEVER_CONFIG[i].maxHours) {
                            values[i] += diffTotal;
                            values[i] = Math.max(0, Math.min(LEVER_CONFIG[i].maxHours, values[i]));
                            added = true;
                            break;
                        }
                    }
                    if (!added) {
                        values[changedIndex] += diffTotal;
                        values[changedIndex] = Math.max(0, Math.min(LEVER_CONFIG[changedIndex].maxHours, values[changedIndex]));
                    }
                }

                updateAllUI();
                pulseLevers(changedIndex);
                console.log(`🔄 ${LEVER_CONFIG[changedIndex].label}: ${values[changedIndex]}h → [${values.join(', ')}]`);
            }

            // ── Drag Handlers ──
            function startDrag(e, index) {
                e.preventDefault();
                draggingIndex = index;
                const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
                dragStartY = clientY;
                dragStartValue = values[index];

                if (e.type === 'touchstart') {
                    document.addEventListener('touchmove', onDragMove, { passive: false });
                    document.addEventListener('touchend', onDragEnd, { passive: false });
                    document.addEventListener('touchcancel', onDragEnd, { passive: false });
                } else {
                    document.addEventListener('mousemove', onDragMove);
                    document.addEventListener('mouseup', onDragEnd);
                }

                handles[index].style.cursor = 'grabbing';
                handles[index].style.transform = 'translateX(-50%) scale(0.92)';
            }

            function onDragMove(e) {
                if (draggingIndex < 0) return;
                e.preventDefault();

                const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
                const index = draggingIndex;

                const trackHeight = getTrackHeight(index);
                const rect = tracks[index].getBoundingClientRect();
                const deltaY = dragStartY - clientY;
                const deltaFraction = deltaY / trackHeight;
                const deltaHours = deltaFraction * MAX_HOURS;

                let newValue = dragStartValue + deltaHours;
                newValue = Math.max(0, Math.min(MAX_HOURS, newValue));

                redistribute(index, newValue);
            }

            function onDragEnd(e) {
                if (draggingIndex < 0) return;
                const index = draggingIndex;
                handles[index].style.cursor = 'grab';
                handles[index].style.transform = 'translateX(-50%) scale(1)';
                draggingIndex = -1;

                document.removeEventListener('mousemove', onDragMove);
                document.removeEventListener('mouseup', onDragEnd);
                document.removeEventListener('touchmove', onDragMove);
                document.removeEventListener('touchend', onDragEnd);
                document.removeEventListener('touchcancel', onDragEnd);
            }

            // ── Attach Events ──
            for (let i = 0; i < NUM_LEVERS; i++) {
                const handle = handles[i];
                const track = tracks[i];

                handle.addEventListener('mousedown', (e) => startDrag(e, i));
                handle.addEventListener('touchstart', (e) => startDrag(e, i), { passive: false });

                track.addEventListener('mousedown', (e) => {
                    if (e.target === handle) return;
                    const rect = track.getBoundingClientRect();
                    const fraction = 1 - (e.clientY - rect.top) / rect.height;
                    let newValue = fraction * LEVER_CONFIG[i].maxHours;
                    newValue = Math.max(0, Math.min(LEVER_CONFIG[i].maxHours, newValue));
                    redistribute(i, newValue);
                });

                track.addEventListener('touchstart', (e) => {
                    if (e.target === handle) return;
                    const touch = e.touches[0];
                    const rect = track.getBoundingClientRect();
                    const fraction = 1 - (touch.clientY - rect.top) / rect.height;
                    let newValue = fraction * LEVER_CONFIG[i].maxHours;
                    newValue = Math.max(0, Math.min(LEVER_CONFIG[i].maxHours, newValue));
                    redistribute(i, newValue);
                }, { passive: true });

                track.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const delta = e.deltaY > 0 ? -1 : 1;
                    const currentValue = values[i];
                    let newValue = currentValue + delta * 2;
                    newValue = Math.max(0, Math.min(LEVER_CONFIG[i].maxHours, newValue));
                    if (newValue !== currentValue) {
                        redistribute(i, newValue);
                    }
                }, { passive: false });
            }

            // ── Share via WhatsApp ──
            function generateShareText() {
                const lines = [
                    '🚴 *TheCyclistDubai · 168-Hour Week*',
                    '',
                ];
                const icons = ['🚴', '👨‍👩‍👧‍👦', '💼', '😴'];
                const names = ['Ride', 'Family', 'Work', 'Recovery'];
                for (let i = 0; i < NUM_LEVERS; i++) {
                    const label = LEVER_CONFIG[i].label;
                    const val = Math.round(values[i]);
                    const mood = getMood(values[i], i);
                    const maxH = LEVER_CONFIG[i].maxHours;
                    const happy = LEVER_CONFIG[i].happyThreshold;
                    const maxStr = maxH < 168 ? `max ${maxH}h` : 'rest of week';
                    lines.push(`${icons[i]} *${names[i]}*: ${val}h (${maxStr} · happy ${happy}h) ${mood}`);
                }
                lines.push('');
                lines.push(`📊 *Total: ${Math.round(values.reduce((a,b) => a + b, 0))}h / 168h*`);
                lines.push('');
                lines.push('⚡ Powered by TheCyclistDubai');
                return lines.join('\n');
            }

            shareBtn.addEventListener('click', () => {
                const text = generateShareText();
                const encoded = encodeURIComponent(text);
                const url = `https://wa.me/?text=${encoded}`;
                window.open(url, '_blank');
            });

            // ── Resize ──
            let resizeTimeout;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(updateAllUI, 100);
            });

            // ── Init ──
            let initSum = values.reduce((a, b) => a + b, 0);
            if (initSum !== MAX_HOURS) {
                const diff = MAX_HOURS - initSum;
                values[0] += diff;
                values[0] = Math.max(0, Math.min(LEVER_CONFIG[0].maxHours, values[0]));
            }
            updateAllUI();

            // ── Keyboard: Reset ──
            document.addEventListener('keydown', (e) => {
                if (e.key === 'r' || e.key === 'R') {
                    const base = MAX_HOURS / NUM_LEVERS;
                    for (let i = 0; i < NUM_LEVERS; i++) {
                        values[i] = Math.round(base);
                    }
                    let total = values.reduce((a, b) => a + b, 0);
                    let diff = MAX_HOURS - total;
                    values[0] += diff;
                    values[0] = Math.max(0, Math.min(LEVER_CONFIG[0].maxHours, values[0]));
                    updateAllUI();
                    document.querySelector('.device-frame').style.transition = 'transform 0.1s';
                    document.querySelector('.device-frame').style.transform = 'scale(0.99)';
                    setTimeout(() => {
                        document.querySelector('.device-frame').style.transform = 'scale(1)';
                    }, 100);
                }
            });

            console.log('🚴 TheCyclistDubai – Monochrome Cycling Computer');
            console.log('   Ride: max 40h, happy from 10h');
            console.log('   Family: rest of 168h, happy from 50h');
            console.log('   Work: max 84h, happy from 48h');
            console.log('   Recovery: max 84h, happy from 56h');
            console.log('   Drag UP to increase, DOWN to decrease. Others adjust proportionally.');
            console.log('   Press "R" to reset. Click "Share" to send via WhatsApp.');

        })();
    </script>
